---
# Loupe delivery pipeline — the fingerprint gate.
#
# Each PR is routed by @expo/fingerprint: if the native layer is unchanged, ship the JS
# over-the-air via Bitrise CodePush; if it changed, do a full CI build + distribute a new binary.
# This is the concrete implementation of docs/design/bitrise-ci-pipeline.md — read that for the
# full annotated rationale, the iOS code-signing notes, and the "install any iteration" registry.
#
# Secrets (set in Bitrise Secrets, NOT here): CODEPUSH_API_TOKEN, SLACK_WEBHOOK_URL,
# plus the Apple service connection + signing files for the iOS native route (iOS only).
# ⚠️ Confirm the CodePush CLI flags/package against current Bitrise docs before first run.

format_version: "23"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: react-native

# Default stack for the app; each workflow's `meta.bitrise.io.stack` overrides this.
meta:
  bitrise.io:
    stack: ubuntu-noble-24.04-bitrise-2025-android
    machine_type_id: g2.linux.large

tools:
  nodejs: 22.23.1

app:
  envs:
    - CODEPUSH_DEPLOYMENT: Staging

# Android-first: the default triggers run ONLY the Android delivery (no code signing needed).
# Once iOS code signing is set up (see .claude/skills/bitrise-setup-loupe, step 4b), switch these to
# `pipeline: deliver` to run both platforms.
trigger_map:
  - pull_request_target_branch: "*"
    workflow: deliver_android
  - push_branch: main
    workflow: deliver_android

pipelines:
  deliver:
    stages:
      - both: {}

stages:
  both:
    workflows:
      - deliver_android: {}
      - deliver_ios: {}

workflows:
  # ==========================================================================================
  # build_apk — on-demand, unconditional native Android APK (ignores the fingerprint gate).
  # Trigger this when you just want an installable APK with the latest code + embedded JS bundle.
  # ==========================================================================================
  build_apk:
    steps:
      - git-clone@8: {}
      - restore-npm-cache@3: {}
      - npm@3:
          title: npm ci
          inputs:
            - command: ci
      - save-npm-cache@1: {}
      - script@1:
          title: Inject Loupe agent-sink config (EXPO_PUBLIC_*) into the JS bundle
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                # App slug is public (it appears in build URLs). Override with LOUPE_APP_SLUG if needed.
                envman add --key EXPO_PUBLIC_LOUPE_APP_SLUG --value "${LOUPE_APP_SLUG:-172f1253-832b-4abf-b338-77a7fa5d7a23}"
                envman add --key EXPO_PUBLIC_LOUPE_BUILD --value "${BITRISE_BUILD_NUMBER:-dev}"
                # The build-trigger token is a Bitrise Secret (LOUPE_TRIGGER_TOKEN). Expo inlines
                # EXPO_PUBLIC_* into the bundle at build time; without it the app uses the console sink.
                if [ -n "${LOUPE_TRIGGER_TOKEN:-}" ]; then
                  # Strip stray whitespace/newline — a trailing newline in the secret gets baked into
                  # the bundle and makes Bitrise reject the token (works in curl, fails in-app).
                  CLEAN_TOKEN="$(printf '%s' "$LOUPE_TRIGGER_TOKEN" | tr -d '[:space:]')"
                  envman add --key EXPO_PUBLIC_LOUPE_TRIGGER_TOKEN --value "$CLEAN_TOKEN"
                  echo "Loupe agent sink ENABLED — trigger token length: ${#CLEAN_TOKEN}."
                else
                  echo "LOUPE_TRIGGER_TOKEN not set — APK falls back to console sink (feedback won't trigger CI)."
                fi
      - script@1:
          title: Expo prebuild (Android)
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                npx expo prebuild --platform android --no-install
      - gradle-runner@5:
          title: Build Android APK (assembleRelease) — bundles the latest JS
          inputs:
            - build_root_directory: android
            - gradle_task: assembleRelease
            - gradlew_path: gradlew
      - deploy-to-bitrise-io@2:
          title: Distribute APK to testers (public install page)
          inputs:
            - is_enable_public_page: "true"
            - notify_user_groups: "none"
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
        machine_type_id: g2.linux.large

  # ==========================================================================================
  # Android — fingerprint gate: JS-only → CodePush OTA; native change → build + distribute.
  # ==========================================================================================
  deliver_android:
    steps:
      - git-clone@8: {}
      - restore-npm-cache@3: {}
      - npm@3:
          title: npm ci
          inputs:
            - command: ci
      - save-npm-cache@1: {}
      - script@1:
          title: Inject Loupe agent-sink config (EXPO_PUBLIC_*) into the JS bundle
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                # App slug is public (it appears in build URLs). Override with LOUPE_APP_SLUG if needed.
                envman add --key EXPO_PUBLIC_LOUPE_APP_SLUG --value "${LOUPE_APP_SLUG:-172f1253-832b-4abf-b338-77a7fa5d7a23}"
                envman add --key EXPO_PUBLIC_LOUPE_BUILD --value "${BITRISE_BUILD_NUMBER:-dev}"
                # The build-trigger token is a Bitrise Secret (LOUPE_TRIGGER_TOKEN). Expo inlines
                # EXPO_PUBLIC_* into the bundle at build time; without it the app uses the console sink.
                if [ -n "${LOUPE_TRIGGER_TOKEN:-}" ]; then
                  # Strip stray whitespace/newline — a trailing newline in the secret gets baked into
                  # the bundle and makes Bitrise reject the token (works in curl, fails in-app).
                  CLEAN_TOKEN="$(printf '%s' "$LOUPE_TRIGGER_TOKEN" | tr -d '[:space:]')"
                  envman add --key EXPO_PUBLIC_LOUPE_TRIGGER_TOKEN --value "$CLEAN_TOKEN"
                  echo "Loupe agent sink ENABLED — trigger token length: ${#CLEAN_TOKEN}."
                else
                  echo "LOUPE_TRIGGER_TOKEN not set — APK falls back to console sink (feedback won't trigger CI)."
                fi
      - script@1:
          title: Fingerprint native layer → routing key (@expo/fingerprint)
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                HASH="$(npx @expo/fingerprint fingerprint:generate | jq -r '.hash')"
                envman add --key BUNDLE_HASH_STRING --value "loupe-fingerprint-android-${HASH}"
                envman add --key APP_VERSION --value "$(node -p "require('./app.json').expo.version")"
                echo "Native fingerprint: ${HASH}"
      - restore-cache@3:
          title: Has a binary already shipped for this native fingerprint?
          inputs:
            - key: $BUNDLE_HASH_STRING

      # ---- ROUTE A · fingerprint HIT = JS-only = ship OTA (no rebuild) ----
      - script@1:
          title: "[ota] Build JS bundle + release to Bitrise CodePush"
          run_if: '{{ not (enveq "BITRISE_CACHE_HIT" "false") }}'
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                echo "Fingerprint HIT → native unchanged → JS-only change; releasing over-the-air via CodePush."
                # CodePush publish is OPTIONAL — skip (don't fail the build) until its credentials are set.
                # Put CODEPUSH_APP_ID + CODEPUSH_API_TOKEN in Bitrise Secrets to enable OTA.
                if [ -z "${CODEPUSH_APP_ID:-}" ] || [ -z "${CODEPUSH_API_TOKEN:-}" ]; then
                  echo "CODEPUSH_APP_ID / CODEPUSH_API_TOKEN not set — skipping CodePush OTA release (build stays green)."
                  exit 0
                fi
                # The `bitrise :codepush` plugin reads the token from BITRISE_API_TOKEN and, given
                # --bundle <dir>, generates the JS bundle itself (npm install + Metro) into it.
                export BITRISE_API_TOKEN="${CODEPUSH_API_TOKEN}"
                mkdir -p _codepush/android
                bitrise :codepush push \
                  --app-id "$CODEPUSH_APP_ID" \
                  --platform android \
                  --deployment "$CODEPUSH_DEPLOYMENT" \
                  --app-version "$APP_VERSION" \
                  --bundle _codepush/android
      - script@1:
          title: "[ota] Notify reviewers via Slack"
          run_if: '{{ not (enveq "BITRISE_CACHE_HIT" "false") }}'
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                # No CodePush webhook exists, so the workflow posts to Slack itself.
                # SLACK_WEBHOOK_URL is an OPTIONAL Slack incoming-webhook in Bitrise Secrets — if it's
                # absent, skip quietly instead of failing the build (${VAR:-} avoids set -u errors).
                if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
                  echo "SLACK_WEBHOOK_URL not set — skipping Slack notification."
                  exit 0
                fi
                curl -fsS -X POST "$SLACK_WEBHOOK_URL" \
                  -H 'content-type: application/json' \
                  -d "{\"text\": \":arrows_counterclockwise: *New Loupe OTA iteration* — v${APP_VERSION} on *${CODEPUSH_DEPLOYMENT}*. Restart the app to pull it.\"}" \
                  || echo "Slack notification failed (non-fatal)."

      # ---- ROUTE B · fingerprint MISS = native change = build + distribute ----
      - script@1:
          title: "[native] Expo prebuild (Android)"
          run_if: '{{ enveq "BITRISE_CACHE_HIT" "false" }}'
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                echo "Fingerprint MISS → native/deps changed → full build + redistribute."
                npx expo prebuild --platform android --no-install
      - gradle-runner@5:
          title: "[native] Build Android APK (assembleRelease)"
          run_if: '{{ enveq "BITRISE_CACHE_HIT" "false" }}'
          inputs:
            - build_root_directory: android
            - gradle_task: assembleRelease
            - gradlew_path: gradlew
      - script@1:
          title: "[native] Stage APK + register fingerprint→binary"
          run_if: '{{ enveq "BITRISE_CACHE_HIT" "false" }}'
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                mkdir -p _nativecache
                APK="$(ls android/app/build/outputs/apk/release/*.apk | head -1)"
                cp "$APK" _nativecache/app-release.apk
                echo "$APP_VERSION" > _nativecache/appversion.txt
                cp "$APK" "$BITRISE_DEPLOY_DIR/app-release.apk"
      - save-cache@1:
          title: "[native] Register this fingerprint as shipped"
          run_if: '{{ enveq "BITRISE_CACHE_HIT" "false" }}'
          inputs:
            - key: $BUNDLE_HASH_STRING
            - paths: _nativecache
      - deploy-to-bitrise-io@2:
          title: "[native] Distribute APK to testers (public install page)"
          run_if: '{{ enveq "BITRISE_CACHE_HIT" "false" }}'
          inputs:
            - is_enable_public_page: "true"
            - notify_user_groups: "none"
      - script@1:
          title: "[native] Notify reviewers via Slack (new build to install)"
          run_if: '{{ enveq "BITRISE_CACHE_HIT" "false" }}'
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                # BITRISE_PUBLIC_INSTALL_PAGE_URL is exported by deploy-to-bitrise-io when the public page is enabled.
                # Slack is optional — skip if the webhook secret isn't set, and never fail the build on a notify error.
                if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
                  echo "SLACK_WEBHOOK_URL not set — skipping Slack notification."
                  exit 0
                fi
                curl -fsS -X POST "$SLACK_WEBHOOK_URL" \
                  -H 'content-type: application/json' \
                  -d "{\"text\": \":package: *New Loupe native build* — v${APP_VERSION} (APK). Install: ${BITRISE_PUBLIC_INSTALL_PAGE_URL}\"}" \
                  || echo "Slack notification failed (non-fatal)."
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
        machine_type_id: g2.linux.large

  # ==========================================================================================
  # iOS — same gate. OTA route is identical; native route needs a SIGNED DEVICE archive
  # (not a simulator build) so testers can install. See docs/design/bitrise-ci-pipeline.md §3.3.
  # NOT in the default trigger_map — set up iOS code signing first (Apple connection + cert +
  # ad-hoc profile + device UDIDs), then switch the trigger_map above to `pipeline: deliver`.
  # ==========================================================================================
  deliver_ios:
    steps:
      - git-clone@8: {}
      - restore-npm-cache@3: {}
      - npm@3:
          title: npm ci
          inputs:
            - command: ci
      - save-npm-cache@1: {}
      - script@1:
          title: Inject Loupe agent-sink config (EXPO_PUBLIC_*) into the JS bundle
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                # App slug is public (it appears in build URLs). Override with LOUPE_APP_SLUG if needed.
                envman add --key EXPO_PUBLIC_LOUPE_APP_SLUG --value "${LOUPE_APP_SLUG:-172f1253-832b-4abf-b338-77a7fa5d7a23}"
                envman add --key EXPO_PUBLIC_LOUPE_BUILD --value "${BITRISE_BUILD_NUMBER:-dev}"
                # The build-trigger token is a Bitrise Secret (LOUPE_TRIGGER_TOKEN). Expo inlines
                # EXPO_PUBLIC_* into the bundle at build time; without it the app uses the console sink.
                if [ -n "${LOUPE_TRIGGER_TOKEN:-}" ]; then
                  # Strip stray whitespace/newline — a trailing newline in the secret gets baked into
                  # the bundle and makes Bitrise reject the token (works in curl, fails in-app).
                  CLEAN_TOKEN="$(printf '%s' "$LOUPE_TRIGGER_TOKEN" | tr -d '[:space:]')"
                  envman add --key EXPO_PUBLIC_LOUPE_TRIGGER_TOKEN --value "$CLEAN_TOKEN"
                  echo "Loupe agent sink ENABLED — trigger token length: ${#CLEAN_TOKEN}."
                else
                  echo "LOUPE_TRIGGER_TOKEN not set — APK falls back to console sink (feedback won't trigger CI)."
                fi
      - script@1:
          title: Fingerprint native layer → routing key (@expo/fingerprint)
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                HASH="$(npx @expo/fingerprint fingerprint:generate | jq -r '.hash')"
                envman add --key BUNDLE_HASH_STRING --value "loupe-fingerprint-ios-${HASH}"
                envman add --key APP_VERSION --value "$(node -p "require('./app.json').expo.version")"
                echo "Native fingerprint: ${HASH}"
      - restore-cache@3:
          inputs:
            - key: $BUNDLE_HASH_STRING

      # ---- ROUTE A · OTA (JS-only) ----
      - script@1:
          title: "[ota] Build JS bundle + release to Bitrise CodePush"
          run_if: '{{ not (enveq "BITRISE_CACHE_HIT" "false") }}'
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                if [ -z "${CODEPUSH_APP_ID:-}" ] || [ -z "${CODEPUSH_API_TOKEN:-}" ]; then
                  echo "CODEPUSH_APP_ID / CODEPUSH_API_TOKEN not set — skipping CodePush OTA release (build stays green)."
                  exit 0
                fi
                # The `bitrise :codepush` plugin reads the token from BITRISE_API_TOKEN and, given
                # --bundle <dir>, generates the JS bundle itself into it.
                export BITRISE_API_TOKEN="${CODEPUSH_API_TOKEN}"
                mkdir -p _codepush/ios
                bitrise :codepush push \
                  --app-id "$CODEPUSH_APP_ID" \
                  --platform ios --deployment "$CODEPUSH_DEPLOYMENT" \
                  --app-version "$APP_VERSION" \
                  --bundle _codepush/ios
      # (+ the same [ota] Slack notify step as Android)

      # ---- ROUTE B · native = signed device archive + distribute ----
      - script@1:
          title: "[native] Expo prebuild (iOS)"
          run_if: '{{ enveq "BITRISE_CACHE_HIT" "false" }}'
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                npx expo prebuild --platform ios --no-install
      - cocoapods-install@3:
          run_if: '{{ enveq "BITRISE_CACHE_HIT" "false" }}'
          inputs:
            - source_root_path: $BITRISE_SOURCE_DIR/ios
      - manage-ios-code-signing@3:
          run_if: '{{ enveq "BITRISE_CACHE_HIT" "false" }}'
          inputs:
            - distribution_method: ad-hoc
      - xcode-archive@5:
          title: "[native] Archive signed .ipa"
          run_if: '{{ enveq "BITRISE_CACHE_HIT" "false" }}'
          inputs:
            - distribution_method: ad-hoc
      - deploy-to-bitrise-io@2:
          run_if: '{{ enveq "BITRISE_CACHE_HIT" "false" }}'
          inputs:
            - is_enable_public_page: "true"
            - notify_user_groups: "none"
    meta:
      bitrise.io:
        stack: osx-xcode-16.4.x
        machine_type_id: g2.mac.large

  # ==========================================================================================
  # process_feedback — the ORCHESTRATOR. Turns an in-app feedback item into a branch (+ PR).
  # Triggered by the app's agent sink with the feedback JSON passed as $LOUPE_FEEDBACK_PAYLOAD.
  # This is the CI counterpart of the "Loupe feedback→PR agent" RDE template — the same Claude
  # Code agent, run headlessly in a CI build. A human reviews/merges the PR (security baseline).
  #
  # Requires in Bitrise Secrets: ANTHROPIC_API_KEY (the agent's key) and a push credential
  # (GIT_SSH_PRIVATE_KEY write deploy key, or GITHUB_API_TOKEN). See notes in chat.
  # ==========================================================================================
  process_feedback:
    # No workflow-level LOUPE_FEEDBACK_PAYLOAD default — a workflow env would OVERRIDE the value
    # the triggering app passes in. The payload comes only from the build-triggered env.
    steps:
      - activate-ssh-key@4:
          run_if: '{{ getenv "GIT_SSH_PRIVATE_KEY" | ne "" }}'
      - git-clone@8: {}
      - restore-npm-cache@3: {}
      - npm@3:
          title: npm ci
          inputs:
            - command: ci
      - save-npm-cache@1: {}
      - script@1:
          title: Feedback → branch (+ PR) via Claude Code (headless)
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                export PATH="$HOME/.local/bin:$PATH"

                # The agent's OWN credential. Bitrise CI reads from Bitrise Secrets — a DIFFERENT store
                # than your RDE saved inputs — so ANTHROPIC_API_KEY must be set here too (see chat).
                if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
                  echo "ANTHROPIC_API_KEY not set in Bitrise Secrets — skipping the agent (build stays green)."
                  exit 0
                fi

                # Install Claude Code (same as the RDE template's warmup).
                curl -fsSL https://claude.ai/install.sh | bash || npm i -g @anthropic-ai/claude-code

                # Default to {} safely — `${VAR:-{}}` trips bash brace-matching and appends a stray }.
                PAYLOAD="${LOUPE_FEEDBACK_PAYLOAD:-}"
                [ -n "$PAYLOAD" ] || PAYLOAD='{}'
                STAMP="$(node -p "Date.now()")"
                BRANCH="loupe/feedback-${STAMP}"
                git config user.name  "Loupe Agent"
                git config user.email "loupe-agent@users.noreply.github.com"
                git checkout -b "$BRANCH"

                # ⚠️ VALIDATE ON FIRST RUN: headless Claude Code flags vary by version; tune as needed.
                claude -p "You are Loupe's fix-it agent. A non-technical reviewer left this in-app feedback (JSON):
                ${PAYLOAD}
                Make the SMALLEST change under src/ or App.tsx that addresses it. Do NOT edit bitrise.yml,
                app.json, secrets, or native config. One focused edit." \
                  --permission-mode acceptEdits \
                  --allowedTools "Read Edit Write" || true

                git add -A
                if git diff --cached --quiet; then
                  echo "Agent produced no changes for this feedback item."
                  exit 0
                fi
                git commit -m "Loupe: address in-app feedback (${STAMP})"

                # Authenticate the PUSH. Prefer GITHUB_API_TOKEN over HTTPS; else rely on the SSH deploy key.
                if [ -n "${GITHUB_API_TOKEN:-}" ]; then
                  SLUG="$(git config --get remote.origin.url | sed -E 's#(git@github.com:|https://[^/]*/)##; s#\.git$##')"
                  git remote set-url origin "https://x-access-token:${GITHUB_API_TOKEN}@github.com/${SLUG}.git"
                fi
                # Retry the push — "fatal error in commit_refs" is a transient GitHub server error,
                # and one flaky push shouldn't drop the whole feedback item.
                for attempt in 1 2 3 4 5; do
                  git push origin "$BRANCH" && break
                  [ "$attempt" = 5 ] && { echo "push failed after 5 attempts"; exit 1; }
                  echo "push attempt ${attempt} failed (transient?); retrying in $((attempt * 5))s..."
                  sleep $((attempt * 5))
                done

                # Open the PR (needs the token). Otherwise the pushed branch is ready for a human to PR.
                if [ -n "${GITHUB_API_TOKEN:-}" ] && command -v gh >/dev/null; then
                  GH_TOKEN="$GITHUB_API_TOKEN" gh pr create --base main --head "$BRANCH" \
                    --title "Loupe: in-app feedback fix" \
                    --body "Automated from an in-app feedback item. Review before merge." || true
                else
                  echo "Pushed branch ${BRANCH} — open a PR from it (no GitHub API token configured)."
                fi

                # Publish this change to the review channel so the reviewer sees it live and can act
                # on it in-app. The CodePush update description carries the PR number for the banner.
                if [ -n "${GITHUB_API_TOKEN:-}" ] && [ -n "${CODEPUSH_APP_ID:-}" ] && [ -n "${CODEPUSH_API_TOKEN:-}" ]; then
                  PR_NUM="$(GH_TOKEN="$GITHUB_API_TOKEN" gh pr view "$BRANCH" --json number -q .number 2>/dev/null || echo '')"
                  if [ -n "$PR_NUM" ]; then
                    export BITRISE_API_TOKEN="$CODEPUSH_API_TOKEN"
                    APP_VERSION="$(node -p "require('./app.json').expo.version")"
                    mkdir -p _codepush/android
                    bitrise :codepush push --app-id "$CODEPUSH_APP_ID" --platform android \
                      --deployment "$CODEPUSH_DEPLOYMENT" --app-version "$APP_VERSION" \
                      --bundle _codepush/android --description "loupe-pr:${PR_NUM}" \
                      || echo "preview publish failed (non-fatal — review the PR on GitHub)."
                  fi
                fi
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
        machine_type_id: g2.linux.large

  # ==========================================================================================
  # apply_decision — the reviewer's in-app verdict on a feedback PR (keep | improve | scrap).
  # Triggered from the app's Review banner via /build/start.json with LOUPE_PR_NUMBER + LOUPE_DECISION.
  #   keep    → merge the PR to main (deliver_android ships it to everyone via OTA)
  #   improve → re-run the agent on the SAME PR branch with a follow-up note, re-publish the preview
  #   scrap   → close the PR + roll back the review channel to the previous release
  # ==========================================================================================
  apply_decision:
    steps:
      - activate-ssh-key@4:
          run_if: '{{ getenv "GIT_SSH_PRIVATE_KEY" | ne "" }}'
      - git-clone@8: {}
      - restore-npm-cache@3: {}
      - npm@3:
          title: npm ci
          inputs:
            - command: ci
      - save-npm-cache@1: {}
      - script@1:
          title: "Apply reviewer decision (keep | improve | scrap)"
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                export PATH="$HOME/.local/bin:$PATH"
                PR="${LOUPE_PR_NUMBER:-}"
                DECISION="${LOUPE_DECISION:-}"
                { [ -n "$PR" ] && [ -n "$DECISION" ]; } || { echo "LOUPE_PR_NUMBER + LOUPE_DECISION required"; exit 1; }
                [ -n "${GITHUB_API_TOKEN:-}" ] || { echo "GITHUB_API_TOKEN required in Bitrise Secrets"; exit 1; }
                export GH_TOKEN="$GITHUB_API_TOKEN"
                SLUG="$(git config --get remote.origin.url | sed -E 's#(git@github.com:|https://[^/]*/)##; s#\.git$##')"
                git remote set-url origin "https://x-access-token:${GITHUB_API_TOKEN}@github.com/${SLUG}.git"
                git config user.name  "Loupe Agent"
                git config user.email "loupe-agent@users.noreply.github.com"

                case "$DECISION" in
                  keep)
                    gh pr merge "$PR" --squash --delete-branch
                    echo "Merged PR #$PR → main; deliver_android will ship it to ${CODEPUSH_DEPLOYMENT}."
                    ;;
                  scrap)
                    gh pr close "$PR" --delete-branch || true
                    if [ -n "${CODEPUSH_APP_ID:-}" ] && [ -n "${CODEPUSH_API_TOKEN:-}" ]; then
                      export BITRISE_API_TOKEN="$CODEPUSH_API_TOKEN"
                      bitrise :codepush rollback --app-id "$CODEPUSH_APP_ID" --platform android \
                        --deployment "$CODEPUSH_DEPLOYMENT" || echo "rollback failed (non-fatal)."
                    fi
                    echo "Closed PR #$PR and rolled back ${CODEPUSH_DEPLOYMENT}."
                    ;;
                  improve)
                    [ -n "${ANTHROPIC_API_KEY:-}" ] || { echo "ANTHROPIC_API_KEY required for improve"; exit 1; }
                    curl -fsSL https://claude.ai/install.sh | bash || npm i -g @anthropic-ai/claude-code
                    BRANCH="$(gh pr view "$PR" --json headRefName -q .headRefName)"
                    git fetch origin "$BRANCH"
                    git checkout "$BRANCH"
                    PAYLOAD="${LOUPE_FEEDBACK_PAYLOAD:-}"
                    [ -n "$PAYLOAD" ] || PAYLOAD='{}'
                    claude -p "Refine the existing change on this branch per the reviewer's follow-up (JSON):
                    ${PAYLOAD}
                    Make the SMALLEST change under src/ or App.tsx. Do NOT edit bitrise.yml, app.json, secrets." \
                      --permission-mode acceptEdits --allowedTools "Read Edit Write" || true
                    git add -A
                    if git diff --cached --quiet; then echo "No refinement produced."; exit 0; fi
                    git commit -m "Loupe: refine PR #$PR per reviewer feedback"
                    for a in 1 2 3 4 5; do
                      git push origin "$BRANCH" && break
                      [ "$a" = 5 ] && { echo "push failed after 5 attempts"; exit 1; }
                      sleep $((a * 5))
                    done
                    if [ -n "${CODEPUSH_APP_ID:-}" ] && [ -n "${CODEPUSH_API_TOKEN:-}" ]; then
                      export BITRISE_API_TOKEN="$CODEPUSH_API_TOKEN"
                      APP_VERSION="$(node -p "require('./app.json').expo.version")"
                      mkdir -p _codepush/android
                      bitrise :codepush push --app-id "$CODEPUSH_APP_ID" --platform android \
                        --deployment "$CODEPUSH_DEPLOYMENT" --app-version "$APP_VERSION" \
                        --bundle _codepush/android --description "loupe-pr:${PR}" || echo "re-publish failed (non-fatal)."
                    fi
                    echo "Refined PR #$PR."
                    ;;
                  *)
                    echo "Unknown decision: $DECISION"; exit 1
                    ;;
                esac
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
        machine_type_id: g2.linux.large
